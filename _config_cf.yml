# ============================================================
# Cloudflare Pages 构建覆盖配置（仅 Cloudflare 部署时合并用）
# 构建命令: npx hexo generate --config _config.yml,_config_cf.yml
#
# 作用: 覆盖 GitHub Pages 的 /skyblog/ 子目录配置,
#       让 Cloudflare 域名下所有资源路径正确(否则 CSS/JS/图片全 404 = 样式丢失)
# ============================================================

url: https://skyblog-dju.pages.dev    # ★ 改成你的 Cloudflare Pages 域名(项目名.pages.dev)
root: /                            # ★ 关键: 根路径(Cloudflare 部署在域名根, 不是子目录)
