<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - 页面走丢了 | Sky</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      background: #0d1117;
      color: #fff;
      overflow: hidden;
    }
    /* 背景壁纸（本地，自适应 cover）：图片地址由脚本按 SITE_PREFIX 注入，
       这里只留渐变兜底，避免子目录/自定义域名两种部署下请求错路径 */
    .bg {
      position: fixed; inset: 0;
      background: radial-gradient(circle at 50% 32%, #1b2a41, #0d1117 70%) center/cover no-repeat;
      filter: brightness(0.55) saturate(1.1);
      transform: scale(1.05);
      animation: slowzoom 20s ease-in-out infinite alternate;
    }
    @keyframes slowzoom { from { transform: scale(1.05); } to { transform: scale(1.15); } }
    .overlay {
      position: fixed; inset: 0;
      background: radial-gradient(circle at 50% 40%, rgba(254,150,0,0.18), rgba(13,17,23,0.75) 70%);
    }
    /* 内容容器：桌面用 100vh，手机用 100dvh（解决地址栏高度跳动） */
    .wrap {
      position: relative; z-index: 2;
      height: 100vh; height: 100dvh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      padding: 24px;
    }
    .code {
      font-size: clamp(72px, 18vw, 180px);
      font-weight: 800; letter-spacing: 6px;
      background: linear-gradient(135deg, #fe9600, #ffd479);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 8px 40px rgba(254,150,0,0.35);
      line-height: 1;
    }
    .sub { margin-top: 8px; font-size: clamp(16px, 3.5vw, 22px); color: #ffe9c7; letter-spacing: 2px; }
    .msg {
      margin-top: 18px; font-size: 14px; color: rgba(255,255,255,0.7);
      max-width: 420px; width: 100%; line-height: 1.7;
    }
    /* 樱花飘落 */
    .petals { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
    .petal {
      position: absolute; top: -10%;
      width: 12px; height: 12px; background: #ffb7c5;
      border-radius: 12px 1px 12px 1px; opacity: 0.8;
      animation: fall linear infinite;
    }
    @keyframes fall {
      0% { transform: translateY(-10vh) rotate(0deg); }
      100% { transform: translateY(110vh) rotate(360deg); }
    }
    .btn {
      margin-top: 30px; display: inline-flex; gap: 14px; flex-wrap: wrap; justify-content: center;
    }
    .btn a {
      text-decoration: none; color: #0d1117; font-weight: 700;
      padding: 12px 26px; border-radius: 999px;
      background: linear-gradient(135deg, #fe9600, #ffd479);
      box-shadow: 0 6px 20px rgba(254,150,0,0.4);
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .btn a.ghost {
      color: #ffe9c7; background: transparent;
      border: 1px solid rgba(255,233,199,0.5); box-shadow: none;
    }
    .btn a:hover { transform: translateY(-3px); box-shadow: 0 10px 28px rgba(254,150,0,0.55); }
    .btn a.ghost:hover { background: rgba(255,233,199,0.12); }
    /* 探测站点根期间先禁用点击，避免点到还没修正的地址 */
    .btn[data-ready="0"] a { pointer-events: none; opacity: 0.55; }

    /* 手机/小平板：缩小间距、按钮换行铺满、字号微调 */
    @media (max-width: 480px) {
      .wrap { padding: 16px; }
      .code { letter-spacing: 3px; }
      .msg { font-size: 13px; padding: 0 8px; }
      .btn { width: 100%; gap: 12px; margin-top: 24px; }
      .btn a { flex: 1 1 auto; padding: 12px 0; min-width: 130px; }
    }
    /* 横屏小屏/短屏设备：收紧垂直间距，避免按钮溢出 */
    @media (max-height: 480px) and (orientation: landscape) {
      .wrap { justify-content: flex-start; padding-top: 8vh; }
      .code { font-size: clamp(48px, 14vh, 90px); }
      .sub { margin-top: 4px; }
      .msg { margin-top: 10px; }
      .btn { margin-top: 16px; }
    }
    /* 减弱动态效果偏好：关闭缩放动画 */
    @media (prefers-reduced-motion: reduce) {
      .bg { animation: none; }
      .petal { animation-duration: 30s !important; }
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="overlay"></div>
  <div class="petals" id="petals"></div>
  <div class="wrap">
    <div class="code">404</div>
    <div class="sub">呀，页面不小心走丢了 🌸</div>
    <p class="msg">你访问的页面可能已被移动、删除，或者从来没有存在过。<br>不如回到首页，看看别的风景吧～</p>
    <div class="btn" data-ready="0">
      <!-- 静态值用相对路径：JS 失效时单层错误地址也能回到站点根，不写死 /skyblog/ -->
      <a href="./" id="lnk-home">回到首页</a>
      <a class="ghost" href="./archives/" id="lnk-archives">浏览文章</a>
    </div>
  </div>
  <script>
    /* 自适应站点根：
       - GitHub Pages 子目录部署：根是 /skyblog
       - 自定义域名代理到根目录：根是 /
       注意用户输错的地址本身可能就带 /skyblog（例如 域名/skyblog/archives/），
       所以不能只靠 location.pathname 猜前缀 —— 直接探测哪个根能打开，用能打开的那个。 */
    (function () {
      var btn = document.querySelector('.btn');
      var home = document.getElementById('lnk-home');
      var arch = document.getElementById('lnk-archives');
      var bg = document.querySelector('.bg');
      var timer;

      function done() {
        clearTimeout(timer);
        if (btn) btn.setAttribute('data-ready', '1');
      }

      function apply(P) {
        home.href = P + '/';
        arch.href = P + '/archives/';
        if (bg) bg.style.backgroundImage = 'url("' + P + '/img/wallpaper/night-clouds.webp")';

        var icon = document.head.querySelector('link[data-site-icon]');
        if (!icon) {
          icon = document.createElement('link');
          icon.rel = 'icon';
          icon.setAttribute('data-site-icon', '1');
          document.head.appendChild(icon);
        }
        icon.href = P + '/img/favicon.png';
      }

      // 本地双击打开 public/404.html：file:// 下只能用同目录相对路径
      if (location.protocol === 'file:') {
        home.href = 'index.html';
        arch.href = 'archives/';
        done();
        return;
      }

      // 先按 pathname 猜一个，保证背景图等资源尽快就位
      var guess = location.pathname.indexOf('/skyblog/') === 0 ? '/skyblog' : '';
      apply(guess);

      // 再依次探测两个候选根，谁返回 200 就换成谁；2 秒内没结果就放行
      var cands = guess === '/skyblog' ? ['/skyblog', ''] : ['', '/skyblog'];
      timer = setTimeout(done, 2000);

      (function probe(i) {
        if (i >= cands.length) {
          done();
          return;
        }
        fetch(cands[i] + '/', { method: 'HEAD', cache: 'no-store' })
          .then(function (r) {
            if (r.ok) {
              apply(cands[i]);
              done();
            } else {
              probe(i + 1);
            }
          })
          .catch(function () { probe(i + 1); });
      })(0);
    })();
  </script>
  <script>
    // 生成樱花飘落（移动端减少数量，保证流畅）
    (function () {
      var box = document.getElementById('petals');
      var isMobile = window.innerWidth <= 480;
      var count = isMobile ? 10 : 18;
      for (var i = 0; i < count; i++) {
        var p = document.createElement('div');
        p.className = 'petal';
        p.style.left = Math.random() * 100 + 'vw';
        p.style.animationDuration = (6 + Math.random() * 8) + 's';
        p.style.animationDelay = (-Math.random() * 10) + 's';
        p.style.opacity = (0.4 + Math.random() * 0.5).toFixed(2);
        p.style.transform = 'scale(' + (0.6 + Math.random() * 0.9) + ')';
        box.appendChild(p);
      }
    })();
  </script>
</body>
</html>
