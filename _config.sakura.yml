# ============================================================
# Sakura 主题覆盖配置（对应 themes/sakura/_config.yml）
# 站点级配置在根 _config.yml；这里只覆盖主题自定义项
# ============================================================

# 站点名（导航栏显示）
prefixName: ""
siteName: Sky

# favicon 与头像
# 头像=首页头部中间那张圆图：想换成自己的图，把图片放到 source/img/custom/avatar.jpg，
# 再把下面 avatar 一行改成 /img/custom/avatar.jpg 即可（以 / 开头走本地 url_for）
favicon: /img/favicon.png
avatar: /img/favicon.png

# 首页头像下方的社交链接（顺序即显示顺序；img 以 / 开头时使用本地文件 source/img/social/，
# 只有相对路径才会自动拼主题 CDN 前缀。图标已改为本地 SVG，避免 CDN 裂图）
# 想换成自己的主页，把 url 改成对应地址即可；带 qrcode 的会在鼠标悬停时弹二维码
social:
  github: {url: https://github.com/zhixiaotx, img: /img/social/github.svg}
  sina: {url: https://weibo.com/, img: /img/social/sina.svg}
  wangyiyun: {url: https://music.163.com/, img: /img/social/wangyiyun.svg}
  zhihu: {url: https://www.zhihu.com/, img: /img/social/zhihu.svg}
  email: {url: mailto:liuliu19901110@gmail.com, img: /img/social/email.svg}
  wechat: {url: https://weixin.qq.com/, img: /img/social/wechat.svg, qrcode: /img/custom/wechat.webp}
  wechat2: {url: https://mp.weixin.qq.com/, img: /img/social/wechat.svg, qrcode: /img/custom/wechat-mp.webp}
  # 二维码换图：直接替换 source/img/custom/wechat.webp 与 wechat-mp.webp（文件名不变）
  # 也可以把 qrcode 写成完整外链，例如 qrcode: https://example.com/my-wechat-qr.png

url: https://zhixiaotx.github.io/skyblog
description: 基于 Hexo + Sakura 搭建的二次元技术博客
cdn: https://cdn.jsdelivr.net/gh/honjun/cdn@1.6

# 关闭 pjax / mathjax，减少首次部署的兼容风险
pjax: 0
mathjax: 0

notice: 欢迎来到 Sky 的小天地 🌸
lazyloadImg: https://cdn.jsdelivr.net/gh/honjun/cdn@1.6/img/loader/orange.progress-bar-stripe-loader.svg

# 导航菜单（路径已通过主题 url_for 兼容 /skyblog/ 子目录）
menus:
  首页: { path: /, fa: fa-home }
  归档: { path: /archives/, fa: fa-archive }
  标签: { path: /tags/, fa: fa-tags }
  分类: { path: /categories/, fa: fa-folder-open }
  清单: { path: javascript:;, fa: fa-list-ul }
  留言板: { path: /comment/, fa: fa-pencil-square-o }
  友人帐: { path: /links/, fa: fa-link }
  关于: { path: /about/, fa: fa-heart }

# 背景图与 bgclass 已统一放到 themes/sakura/_config.yml（避免数组 concat 重复）

# 开始菜单（使用本地壁纸，img 以 / 开头即走本地 url_for，避免 CDN 裂图）
startdash:
  - {url: /about/, title: Sky, desc: 关于本站, img: /img/wallpaper/anime-scene.webp}
  - {url: /archives/, title: 归档, desc: 所有文章, img: /img/wallpaper/city-night.webp}
  - {url: /tags/, title: 标签, desc: 按标签浏览, img: /img/wallpaper/china-city.webp}

siteBuildingTime: 08/26/2026

# 移动端社交按钮（Font Awesome 图标，无需图片）
msocial:
  github: {url: https://github.com/zhixiaotx, fa: fa-github, color: 333}
  weibo: {url: https://weibo.com/, fa: fa-weibo, color: dd4b39}
  qq: {url: https://im.qq.com/, fa: fa-qq, color: 25c6fe}
  email: {url: mailto:liuliu19901110@gmail.com, fa: fa-envelope, color: dd4b39}

# 头部背景视频：已停用（留空后 sakura-app.js 不会再加载 Unbroken.mp4）
# 想恢复背景视频：url 填视频目录、name 填文件名（多个用逗号隔开），并去掉 headertop.ejs 里 video-container 的 display:none
movies:
  url: ""
  name: ""

# 音乐播放器（myhkw.cn 免插件版）
# 在 https://myhkw.cn 后台换歌单后，把新的 id / key 填到这里即可（m 保持 1）
music:
  enable: true
  id: "178355703190"
  key: "178355703190"
  m: "1"

# 评论系统：暂不启用（如需可配置 Valine / Waline）
valine: false
waline:
  enable: false

# 赞赏二维码（文章末尾“赏”弹窗 / 打赏页）
# 图片实际文件在 source/img/custom/donate/ 下；
# 模板已改为 /img/... 路径走 url_for（自动补 /skyblog/ 前缀），不再拼 cdn，换图只换文件即可
donate:
  alipay: /img/custom/donate/AliPayQR.webp   # 支付宝
  wechat: /img/custom/donate/WeChanQR.webp   # 微信（文章页弹窗）
  wechatSQ: /img/custom/donate/WeChanSQ.webp # 微信（打赏页）
