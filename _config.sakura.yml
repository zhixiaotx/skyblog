# ============================================================
# Sakura 主题覆盖配置（对应 themes/sakura/_config.yml）
# 站点级配置在根 _config.yml；这里只覆盖主题自定义项
# ============================================================

# 站点名（导航栏显示）
prefixName: ""
siteName: Sky

# favicon 与头像（复用已上传到 source/img 的图片）
favicon: /img/favicon.png
avatar: /img/favicon.png

url: https://zhixiaotx.github.io/skyblog
description: 基于 Hexo + Sakura 搭建的二次元技术博客
cdn: https://cdn.jsdelivr.net/gh/honjun/cdn@1.6

# 关闭 pjax / mathjax，减少首次部署的兼容风险
pjax: 0
mathjax: 0

notice: 欢迎来到 Sky 的小天地 🌸
lazyloadImg: https://cdn.jsdelivr.net/gh/honjun/cdn@1.6/img/loader/orange.progress-bar-stripe-loader.svg

# 导航菜单（路径已通过主题 url_for 兼容 /skyblog/ 子目录）
menus:
  首页: { path: /, fa: fa-home }
  归档: { path: /archives/, fa: fa-archive }
  标签: { path: /tags/, fa: fa-tags }
  分类: { path: /categories/, fa: fa-folder-open }
  清单: { path: javascript:;, fa: fa-list-ul }
  留言板: { path: /comment/, fa: fa-pencil-square-o }
  友人帐: { path: /links/, fa: fa-link }
  关于: { path: /about/, fa: fa-heart }

# 背景图与 bgclass 已统一放到 themes/sakura/_config.yml（避免数组 concat 重复）

# 开始菜单（使用本地壁纸，img 以 / 开头即走本地 url_for，避免 CDN 裂图）
startdash:
  - {url: /about/, title: Sky, desc: 关于本站, img: /img/wallpaper/anime-scene.webp}
  - {url: /archives/, title: 归档, desc: 所有文章, img: /img/wallpaper/city-night.webp}
  - {url: /tags/, title: 标签, desc: 按标签浏览, img: /img/wallpaper/china-city.webp}

siteBuildingTime: 08/26/2026

# 移动端社交按钮（使用 Font Awesome 图标，无需图片）
msocial:
  github: {url: https://github.com/zhixiaotx, fa: fa-github, color: 333}
  email: {url: mailto:liuliu19901110@gmail.com, fa: fa-envelope, color: dd4b39}

# 背景音乐（网易云飙升榜，原歌单外链已全部失效）
aplayer:
  id: 19723756
  server: netease
  type: playlist
  fixed: true
  autoplay: false
  loop: all
  order: random
  preload: auto
  volume: 0.7
  mutex: true

# 评论系统：暂不启用（如需可配置 Valine / Waline）
valine: false
waline:
  enable: false
